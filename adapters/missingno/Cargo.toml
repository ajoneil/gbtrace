[package]
name = "morepork-missingno"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "morepork-missingno"
path = "src/main.rs"

# The VCS adapter is a separate binary: the VCS oracle contract (single-dash
# -rom/-out/-spec flags, canonical suite palette, verdict bytes at $80..$83)
# is a different world from the GB profile-driven CLI above.
[[bin]]
name = "morepork-missingno-vcs"
path = "src/vcs.rs"

[dependencies]
# Track the latest missingno (no rev pin) — CI resolves it fresh on each build.
# `morepork` is missingno's own trace feature (renamed from `gbtrace` when
# the sister project renamed).
missingno-gb = { git = "https://github.com/ajoneil/missingno", features = ["morepork"] }
missingno-gbc = { git = "https://github.com/ajoneil/missingno", features = ["morepork"] }
# Declared like missingno-gb's own dep (same git source, no branch key) so it
# unifies with the instance behind `ConsoleUi::raw_frame`'s `RawFrame`.
missingno-core = { git = "https://github.com/ajoneil/missingno" }
clap = { version = "4", features = ["derive"] }
# VCS: the machine comes from the sibling checkout (the suite iterates on
# unpushed emulator work); the trace format is this repo's own crate.
missingno-vcs = { path = "../../../missingno/crates/systems/vcs" }
morepork = { path = "../../crates/morepork" }
sha2 = "0.11"
